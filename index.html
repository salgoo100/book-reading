<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Tae-ri's Story Time</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a2e2a;--soft:#8a7a70;--accent:#ff8a3d;--accent2:#4bb3a7;--hl:#ffe066;--line:#f0e2cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:8px}
h1{font-size:1.5rem;margin:0}
.stars{font-size:1.1rem;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 2px 0 var(--line)}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.book{background:var(--card);border-radius:20px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line);border:none;font:inherit;color:inherit;transition:transform .1s}
.book:active{transform:scale(.97)}
.book .cover{font-size:3.4rem}
.book b{display:block;font-size:1.15rem;margin-top:6px}
.book small{color:var(--soft)}
.done{color:var(--accent2);font-weight:bold}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.btn{border:none;border-radius:16px;padding:12px 16px;font:inherit;font-size:1.05rem;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--accent);color:#fff;box-shadow:0 3px 0 #d96a22}
.btn.teal{background:var(--accent2);color:#fff;box-shadow:0 3px 0 #2f8a80}
.scene{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line)}
.art{font-size:clamp(3.5rem,14vw,6.5rem);text-align:center;line-height:1.2;min-height:1.3em;letter-spacing:.05em}
.text{font-size:clamp(1.3rem,4.5vw,1.9rem);line-height:1.6;text-align:center;margin:14px 0 4px}
.text span{border-radius:6px;padding:0 2px;cursor:pointer}
.text span.on{background:var(--hl)}
.ko{text-align:center;color:var(--soft);font-size:1rem;min-height:1.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.panel{margin-top:16px;background:#fff4e0;border-radius:18px;padding:16px;display:none}
.panel.show{display:block}
.panel h3{margin:0 0 6px}
.panel p{margin:6px 0;font-size:1.15rem;line-height:1.5}
.panel .k{color:var(--soft);font-size:.95rem}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.opt{font-size:1.1rem}
.opt.right{background:#c9f2d0}.opt.wrong{background:#ffd6d6}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.dots{color:var(--soft)}
.end{text-align:center}
.end .big{font-size:5rem}
.toggle{font-size:.95rem}
.art.ill{font-size:0;line-height:0;margin:-6px -6px 0}
.art.ill svg{width:100%;max-height:52vh;border-radius:18px;display:block;box-shadow:inset 0 0 0 4px #fff}
.breathe{animation:breathe 3s ease-in-out infinite;transform-origin:center bottom;transform-box:fill-box}
@keyframes breathe{50%{transform:scaleY(1.03)}}
.zzz text{animation:zzz 2.4s ease-in-out infinite}.zzz text:nth-child(2){animation-delay:.4s}.zzz text:nth-child(3){animation-delay:.8s}
@keyframes zzz{0%,100%{opacity:.2;transform:translateY(4px)}50%{opacity:1;transform:translateY(-4px)}}
.hop{animation:hop .45s ease-in-out infinite;transform-box:fill-box}
@keyframes hop{50%{transform:translateY(-8px)}}
.chew{animation:chew .25s ease-in-out infinite;transform-box:fill-box}
@keyframes chew{50%{transform:rotate(-6deg)}}
.shiver{animation:shiver .18s linear infinite;transform-box:fill-box}
@keyframes shiver{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}
.twinkle{animation:twinkle 1.2s ease-in-out infinite}
@keyframes twinkle{50%{opacity:.35}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>
<body>
<header>
  <h1>📚 Tae-ri's Story Time</h1>
  <div class="stars" id="stars">⭐ 0</div>
</header>
<main id="app"></main>

<script>
const KID = "Tae-ri";

// 모든 이야기는 퍼블릭 도메인 원작(이솝우화, 영국 민담, 페로 동화)을 쉬운 영어로 새로 쓴 것
const STORIES = [
{
  id:"lion", title:"The Lion and the Mouse", ko:"사자와 쥐", cover:"🦁🐭",

  scenes:[
    {svg:1, art:"🦁💤", text:"A big lion is sleeping under a tree.", ko:"커다란 사자가 나무 아래에서 자고 있어요.",
     ask:{q:"Is the lion big or small?", ko:"사자는 클까요, 작을까요?"}},
    {svg:2, art:"🐭🏃‍♂️🦁", text:"A tiny mouse runs on the lion's nose!", ko:"작은 쥐가 사자 코 위로 달려가요!",
     why:{who:"🐭 Mouse", text:"I didn't see him! I was looking for cheese.", ko:"못 봤어요! 치즈 찾느라 바빴거든요."},
     quiz:{q:"How does the lion feel?", opts:[["😡","angry",1],["😴","sleepy",0],["😂","funny",0]]}},
    {svg:3, art:"🦁🐾🐭", text:"\"ROAR! I will eat you!\" \"Please let me go. Someday I will help you!\"", ko:"\"어흥! 잡아먹겠다!\" \"놓아주세요. 언젠가 도와드릴게요!\"",
     why:{who:"🦁 Lion", text:"Ha ha! A tiny mouse help me? That is so funny! Okay, go home, little one.", ko:"하하! 작은 쥐가 나를 돕는다고? 웃기네! 그래, 집에 가렴."},
     ask:{q:`${KID}, can a tiny mouse help a big lion?`, ko:"작은 쥐가 큰 사자를 도울 수 있을까?"}},
    {svg:4, art:"🦁🕸️😢", text:"One day, the lion is caught in a net. \"Help! Help!\"", ko:"어느 날 사자가 그물에 걸렸어요. \"도와줘!\"",

    {svg:6, art:"🦁❤️🐭", text:"\"Thank you, little friend!\" The lion and the mouse are best friends.", ko:"\"고마워, 작은 친구!\" 둘은 단짝이 되었어요.",
     ask:{q:`${KID}, who is your little friend?`, ko:"태리의 작은 친구는 누구야?"}}
  ]
},
{
  id:"race", title:"The Tortoise and the Hare", ko:"토끼와 거북이", cover:"🐢🐇",
  moral:"Slow and steady wins the race!", moralKo:"천천히 꾸준히 하면 이겨요!",
  scenes:[
    {art:"🐇💨", text:"\"I am the fastest!\" says the hare. \"Nobody can beat me!\"", ko:"\"내가 제일 빨라! 아무도 날 못 이겨!\"",
     why:{who:"🐇 Hare", text:"I have long legs! Hop, hop, zoom! I like to show off.", ko:"내 다리는 길거든! 깡충, 슝! 자랑하는 게 좋아."}},
    {art:"🐢🙋", text:"\"Let's have a race,\" says the tortoise.", ko:"\"우리 경주하자.\" 거북이가 말해요.",
     why:{who:"🐢 Tortoise", text:"I am slow, but I never stop. I want to try!", ko:"난 느리지만 절대 멈추지 않아. 해보고 싶어!"},
     ask:{q:"Who will win? The hare or the tortoise?", ko:"누가 이길까? 토끼? 거북이?"}},
    {art:"🏁🐇💨 🐢", text:"Ready, set, GO! The hare runs far, far away.", ko:"준비, 출발! 토끼가 멀리멀리 달려가요."},

     quiz:{q:"Is it a good idea to sleep in a race?", opts:[["👍","yes",0],["👎","no",1]]}},
    {art:"🐢👣👣👣", text:"Step, step, step. The tortoise never stops.", ko:"한 걸음, 한 걸음. 거북이는 멈추지 않아요.",
     ask:{q:`Let's cheer! "Go, tortoise, go!" Can you say it, ${KID}?`, ko:"같이 응원해요! \"Go, tortoise, go!\""}},
    {art:"🐢🏆🎉", text:"The tortoise wins! The hare wakes up. \"Oh no!\"", ko:"거북이가 이겼어요! 토끼가 깨서 \"이런!\"",

{
  id:"ant", title:"The Ant and the Grasshopper", ko:"개미와 베짱이", cover:"🐜🦗",

  scenes:[
    {art:"☀️🦗🎻", text:"It is summer. The grasshopper sings and plays all day.", ko:"여름이에요. 베짱이는 하루 종일 노래하고 놀아요.",
     why:{who:"🦗 Grasshopper", text:"The sun is warm! Why work? Let's sing! La la la!", ko:"햇살이 따뜻해! 왜 일해? 노래하자! 랄라라!"}},
    {art:"🐜🌾🐜", text:"The ants carry food, one by one.", ko:"개미들은 음식을 하나씩 날라요.",
     why:{who:"🐜 Ant", text:"Winter is coming. It will be cold. We need food!", ko:"겨울이 와요. 추워질 거예요. 음식이 필요해요!"},
     ask:{q:"What food do the ants carry?", ko:"개미들은 무슨 음식을 나를까?"}},
    {art:"❄️🦗🥶", text:"Now it is winter. Brrr! The grasshopper is cold and hungry.", ko:"이제 겨울이에요. 덜덜! 베짱이는 춥고 배고파요.",

    {art:"🦗🚪🐜", text:"Knock, knock. \"Can I have some food, please?\"", ko:"똑똑. \"음식 좀 나눠줄 수 있니?\"",
     ask:{q:`${KID}, what should the ants do?`, ko:"태리라면 개미들이 어떻게 해야 할 것 같아?"}},
    {art:"🐜🍲🦗", text:"The ants share their soup. \"Next summer, I will work too!\"", ko:"개미들이 수프를 나눠줘요. \"내년 여름엔 나도 일할게!\"",

},
{
  id:"wolf", title:"The Boy Who Cried Wolf", ko:"양치기 소년", cover:"👦🐺",

    {art:"👨‍🌾😠👦😂", text:"\"Ha ha! There is no wolf!\" The people are angry.", ko:"\"하하! 늑대 없지롱!\" 사람들이 화가 났어요.",

     quiz:{q:"How does the boy feel?", opts:[["😭","sad",1],["😆","happy",0]]}},
    {art:"👦🤝🐑", text:"\"I am sorry. From now on, I will always tell the truth.\"", ko:"\"죄송해요. 이제부터 항상 진실만 말할게요.\""}

},
{
  id:"pigs", title:"The Three Little Pigs", ko:"아기 돼지 삼형제", cover:"🐷🏠",

  scenes:[
    {art:"🐷🐷🐷", text:"Three little pigs want to build houses.", ko:"아기 돼지 세 마리가 집을 지으려 해요."},
    {art:"🐷🌾🏠", text:"Pig One builds a straw house. \"Done! Let's play!\"", ko:"첫째는 지푸라기 집. \"끝! 놀자!\"",
     why:{who:"🐷 Pig One", text:"Straw is easy and fast! I want to play soon.", ko:"지푸라기는 쉽고 빨라! 빨리 놀고 싶어."}},
    {art:"🐷🪵🏠", text:"Pig Two builds a stick house. \"Done! Let's play!\"", ko:"둘째는 나무막대 집. \"끝! 놀자!\""},
    {art:"🐷🧱🏠", text:"Pig Three builds a brick house. It takes a long time.", ko:"셋째는 벽돌 집. 오래 걸려요.",
     why:{who:"🐷 Pig Three", text:"Bricks are heavy, but strong. I want a safe house.", ko:"벽돌은 무겁지만 튼튼해. 안전한 집이 좋아."},
     ask:{q:`${KID}, which house do you like?`, ko:"태리는 어떤 집이 좋아?"}},
    {art:"🐺💨🏚️", text:"The wolf comes. \"I'll huff and I'll puff and I'll blow your house down!\"", ko:"늑대가 와요. \"후~ 후~ 불어서 날려버리겠다!\"",
     ask:{q:"Let's blow like the wolf! Huff! Puff!", ko:"늑대처럼 후~ 불어볼까?"}},
    {art:"🐺😵🧱🐷🐷🐷", text:"The straw and stick houses fall down. But the brick house stands!", ko:"지푸라기와 막대 집은 무너졌지만 벽돌 집은 끄떡없어요!",
     quiz:{q:"Which house is the strongest?", opts:[["🌾","straw",0],["🪵","sticks",0],["🧱","bricks",1]]}}

},
{
  id:"cinderella", title:"Cinderella", ko:"신데렐라", cover:"👗👠",
  moral:"Be kind, and good things come!", moralKo:"착한 마음은 좋은 일을 불러와요!",
  scenes:[

// ---------- SVG 일러스트 (사자와 쥐) ----------
const C={mane:"#c26a2b",mane2:"#a8551f",fur:"#f6b453",fur2:"#e89a35",face:"#fbc97a",mouse:"#a7adb7",mouse2:"#8c939e",pink:"#f7a8b8",ink:"#3a2e2a"};
function bg(mode){
  const sky = mode==="sunset"?["#ffb37a","#ffe0b5"]:mode==="dark"?["#9fb3c8","#dfe7ef"]:["#9edcf5","#e6f7ff"];
  const sun = mode==="sunset"?`<circle cx="320" cy="150" r="34" fill="#ff7e5f" opacity=".85"/>`:
              mode==="dark"?`<circle cx="330" cy="50" r="18" fill="#fff7cc" opacity=".7"/>`:
              `<circle cx="335" cy="55" r="26" fill="#ffd95a"/><circle cx="335" cy="55" r="36" fill="#ffd95a" opacity=".25"/>`;
  return `<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${sky[0]}"/><stop offset="1" stop-color="${sky[1]}"/></linearGradient></defs>
  <rect width="400" height="300" fill="url(#sky)"/>${sun}
  <ellipse cx="70" cy="70" rx="30" ry="10" fill="#fff" opacity=".8"/><ellipse cx="95" cy="63" rx="22" ry="10" fill="#fff" opacity=".8"/>
  <path d="M0 200 Q100 180 200 195 T400 190 V300 H0Z" fill="${mode==="sunset"?"#e3c27a":"#cfe08a"}"/>
  <path d="M0 235 Q120 220 240 232 T400 228 V300 H0Z" fill="${mode==="sunset"?"#d4ad62":"#b7d26d"}"/>
  <g transform="translate(60 120)"><path d="M18 90 C20 60 14 40 8 20 M18 60 C30 40 40 30 50 22" stroke="#7a5230" stroke-width="7" fill="none" stroke-linecap="round"/>
    <ellipse cx="25" cy="14" rx="55" ry="14" fill="#7fb24a"/><ellipse cx="45" cy="6" rx="38" ry="11" fill="#93c25a"/></g>
  <g fill="#9cc25a">${[[150,248],[260,255],[350,245],[30,260]].map(([x,y])=>`<path d="M${x} ${y} l3 -10 l3 10 l3 -8 l2 8z"/>`).join("")}</g>`;
}
function eyes(m){
  const open=(x)=>`<circle cx="${x}" cy="-6" r="4.5" fill="${C.ink}"/><circle cx="${x+1.5}" cy="-7.5" r="1.5" fill="#fff"/>`;
  const shut=(x)=>`<path d="M${x-6} -6 q6 6 12 0" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(m==="sleep")return shut(-11)+shut(11);
  if(m==="peek")return shut(-11)+open(11);
  if(m==="angry")return open(-11)+open(11)+`<path d="M-19 -17 L-5 -12 M19 -17 L5 -12" stroke="${C.ink}" stroke-width="3" stroke-linecap="round"/>`;
  if(m==="scared")return `<circle cx="-11" cy="-6" r="7" fill="#fff"/><circle cx="11" cy="-6" r="7" fill="#fff"/><circle cx="-11" cy="-5" r="3" fill="${C.ink}"/><circle cx="11" cy="-5" r="3" fill="${C.ink}"/><path d="M-18 -18 L-6 -20 M18 -18 L6 -20" stroke="${C.ink}" stroke-width="2.5" stroke-linecap="round"/>`;
  return `<path d="M-17 -5 q6 -7 12 0 M5 -5 q6 -7 12 0" stroke="${C.ink}" stroke-width="3" fill="none" stroke-linecap="round"/>`; // happy
}
function mouth(m){
  if(m==="angry")return `<ellipse cx="0" cy="17" rx="10" ry="8" fill="#8a2b2b"/><path d="M-6 11 l2 4 l2 -4 M2 11 l2 4 l2 -4" fill="#fff"/>`;
  if(m==="scared")return `<path d="M-8 18 q4 -4 8 0 q4 4 8 0" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
  if(m==="happy")return `<path d="M-10 12 q10 12 20 0" stroke="${C.ink}" stroke-width="2.5" fill="#d9534f" stroke-linecap="round"/>`;
  return `<path d="M-6 13 q3 3 6 0 q3 3 6 0" stroke="${C.ink}" stroke-width="2.5" fill="none" stroke-linecap="round"/>`;
}
function lion(x,y,s,m){
  const mane=[...Array(12)].map((_,i)=>{const a=i*Math.PI/6;return `<circle cx="${(Math.cos(a)*36).toFixed(1)}" cy="${(Math.sin(a)*36).toFixed(1)}" r="16" fill="${i%2?C.mane:C.mane2}"/>`}).join("");
  return `<g transform="translate(${x} ${y}) scale(${s})"><g class="${m==="sleep"||m==="peek"?"breathe":m==="scared"?"shiver":""}">
    <path d="M-68 0 C-100 -5 -105 -40 -92 -48" stroke="${C.fur2}" stroke-width="7" fill="none" stroke-linecap="round"/><ellipse cx="-92" cy="-50" rx="9" ry="11" fill="${C.mane}"/>
    <ellipse cx="0" cy="0" rx="72" ry="38" fill="${C.fur}"/><ellipse cx="-10" cy="12" rx="50" ry="20" fill="${C.face}" opacity=".6"/>
    <ellipse cx="-45" cy="32" rx="22" ry="10" fill="${C.fur2}"/><ellipse cx="45" cy="34" rx="24" ry="11" fill="${C.fur}"/><ellipse cx="78" cy="34" rx="24" ry="11" fill="${C.fur}"/>
    <path d="M90 32 v6 M96 31 v6 M70 34 v5" stroke="${C.fur2}" stroke-width="2"/>
    <g transform="translate(75 -30)">${mane}
      <circle cx="-22" cy="-26" r="9" fill="${C.fur}"/><circle cx="22" cy="-26" r="9" fill="${C.fur}"/><circle cx="-22" cy="-26" r="4" fill="${C.pink}"/><circle cx="22" cy="-26" r="4" fill="${C.pink}"/>
      <circle r="31" fill="${C.face}"/>${eyes(m)}
      <circle cx="-20" cy="7" r="6" fill="${C.pink}" opacity=".6"/><circle cx="20" cy="7" r="6" fill="${C.pink}" opacity=".6"/>
      <ellipse cx="0" cy="7" rx="13" ry="9" fill="#fde3b3"/><path d="M-6 2 h12 l-6 6z" fill="#7a3e2b"/>${mouth(m)}
    </g></g></g>`;
}
function mouse(x,y,s,m,flip){
  const eye = m==="scared"?`<circle cx="20" cy="-10" r="4" fill="#fff"/><circle cx="20" cy="-9" r="2" fill="${C.ink}"/><path d="M24 -4 q2 5 0 8" stroke="#6ec3ff" stroke-width="2" fill="none"/>`
            : m==="happy"?`<path d="M16 -10 q4 -4 8 0" stroke="${C.ink}" stroke-width="2" fill="none" stroke-linecap="round"/>`
            : `<circle cx="20" cy="-10" r="2.6" fill="${C.ink}"/><circle cx="21" cy="-11" r=".9" fill="#fff"/>`;
  return `<g transform="translate(${x} ${y}) scale(${flip?-s:s} ${s})"><g class="${m==="run"?"hop":m==="chew"?"chew":""}">
    <path d="M-18 4 C-40 10 -45 -15 -30 -18" stroke="${C.mouse2}" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <ellipse cx="0" cy="0" rx="20" ry="13" fill="${C.mouse}"/>
    <circle cx="8" cy="-22" r="9" fill="${C.mouse}"/><circle cx="8" cy="-22" r="5.5" fill="${C.pink}"/>
    <circle cx="16" cy="-8" r="11" fill="${C.mouse}"/><circle cx="20" cy="-23" r="8" fill="${C.mouse}"/><circle cx="20" cy="-23" r="4.5" fill="${C.pink}"/>
    ${eye}<circle cx="27" cy="-5" r="2.6" fill="#e86a8a"/><circle cx="16" cy="-3" r="3" fill="${C.pink}" opacity=".7"/>
    ${m==="happy"?`<path d="M18 0 q4 4 8 0" stroke="${C.ink}" stroke-width="1.6" fill="none"/>`:""}
    ${m==="chew"?`<rect x="23" y="0" width="3" height="4" fill="#fff" stroke="${C.ink}" stroke-width=".6"/>`:""}
    ${m==="beg"?`<ellipse cx="22" cy="4" rx="4" ry="5" fill="${C.pink}"/>`:`<ellipse cx="8" cy="12" rx="5" ry="3" fill="${C.pink}"/>`}
    <ellipse cx="-8" cy="12" rx="5" ry="3" fill="${C.pink}"/></g></g>`;
}
const net=(cx,cy,broken)=>`<defs><pattern id="net" width="16" height="16" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><path d="M0 0 H16 M0 0 V16" stroke="#7a5a3a" stroke-width="2.4"/></pattern>
  <clipPath id="netclip"><ellipse cx="${cx}" cy="${cy}" rx="140" ry="75"/></clipPath></defs>
  <rect x="0" y="0" width="400" height="300" fill="url(#net)" clip-path="url(#netclip)" opacity=".85"/>
  <ellipse cx="${cx}" cy="${cy}" rx="140" ry="75" fill="none" stroke="#7a5a3a" stroke-width="4"/>
  ${broken?`<path d="M${cx+105} ${cy-50} l12 -8 M${cx+115} ${cy-30} l14 4 M${cx+95} ${cy-62} l4 -14" stroke="#7a5a3a" stroke-width="3" stroke-linecap="round"/>
  <g class="twinkle" fill="#ffd95a"><path d="M${cx+125} ${cy-60} l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z"/><path d="M${cx+80} ${cy-75} l2 5 l5 2 l-5 2 l-2 5 l-2 -5 l-5 -2 l5 -2z"/></g>`:""}`;
const zzz=`<g class="zzz" fill="#5b7fa8" font-family="Comic Sans MS, cursive" font-weight="bold"><text x="265" y="110" font-size="22">Z</text><text x="285" y="88" font-size="28">Z</text><text x="310" y="62" font-size="34">Z</text></g>`;
const hearts=`<g class="twinkle" fill="#ff6b8a">${[[110,90,1],[300,70,1.3],[340,120,.9]].map(([x,y,s])=>`<path transform="translate(${x} ${y}) scale(${s})" d="M0 4 C-8 -6 -18 2 0 14 C18 2 8 -6 0 4z"/>`).join("")}</g>`;
const ART={
  1:()=>bg()+lion(170,215,1,"sleep")+zzz,
  2:()=>bg()+lion(160,215,1,"peek")+mouse(240,148,.9,"run")+`<path d="M195 140 h-20 M198 150 h-26 M195 160 h-18" stroke="#fff" stroke-width="3" stroke-linecap="round" opacity=".9"/>`,
  3:()=>bg()+lion(150,220,1,"angry")+`<ellipse cx="300" cy="215" rx="26" ry="12" fill="${C.fur}"/>`+mouse(300,190,1.1,"scared",true)
        +`<g stroke="#e05a3a" stroke-width="3" stroke-linecap="round" class="twinkle"><path d="M262 140 l14 -8 M266 156 l18 0 M262 172 l14 8"/></g>`,
  4:()=>bg("dark")+lion(170,215,1,"scared")+net(200,195),
  5:()=>bg("dark")+lion(150,215,1,"scared")+net(180,195,true)+mouse(320,140,1,"chew",true),
  6:()=>bg("sunset")+lion(170,215,1,"happy")+mouse(245,140,.8,"happy")+hearts
};
const svgArt=n=>`<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img">${ART[n]()}</svg>`;

// ---------- 상태 ----------
const store = {
  get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
};
let stars = store.get("stars",0);
let finished = store.get("finished",{});
let showKo = store.get("showKo",true);
const app = document.getElementById("app");
const starsEl = document.getElementById("stars");
function addStar(n=1){stars+=n;store.set("stars",stars);starsEl.textContent="⭐ "+stars;starsEl.classList.remove("pop");void starsEl.offsetWidth;starsEl.classList.add("pop")}
starsEl.textContent="⭐ "+stars;

// ---------- 음성 ----------
let voice=null, voices=[];
// 자연스러운(뉴럴) 음성일수록 높은 점수
function score(v){
  let s=0;const n=v.name;
  if(/Natural|Neural|Premium|Enhanced|Online/i.test(n))s+=100;
  if(/Ava|Aria|Jenny|Emma|Michelle|Ana|Samantha|Allison|Google US English/i.test(n))s+=30;
  if(v.lang==="en-US"||v.lang==="en_US")s+=20;else if(/^en-(GB|AU|CA)/i.test(v.lang))s+=10;
  if(/David|Zira|Mark|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Zarvox|Superstar|Wobble|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i.test(n))s-=50;
  return s;
}
function pickVoice(){
  voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
  const saved=store.get("voice",null);
  voice=voices.find(v=>v.name===saved)||voices[0]||null;
  renderVoicePicker();
}
function renderVoicePicker(){
  const sel=document.getElementById("voiceSel");
  if(!sel)return;
  sel.innerHTML=voices.map(v=>`<option ${v===voice?"selected":""}>${v.name}</option>`).join("");
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function speak(text,{rate=0.9,pitch=1,spans=null}={}){
  if(!("speechSynthesis" in window))return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text);
  if(voice)u.voice=voice; u.lang="en-US"; u.rate=rate; u.pitch=pitch;
  if(spans){
    const starts=[];let pos=0;
    spans.forEach(s=>{const i=text.indexOf(s.dataset.w,pos);starts.push(i);pos=i+s.dataset.w.length});
    u.onboundary=e=>{spans.forEach((s,i)=>s.classList.toggle("on",e.charIndex>=starts[i]&&e.charIndex<starts[i]+s.dataset.w.length))};
    u.onend=()=>spans.forEach(s=>s.classList.remove("on"));
  }
  speechSynthesis.speak(u);
}
// 음높이를 크게 바꾸면 기계음처럼 들려서 살짝만 조절
const voiceFor=who=>/Lion|Wolf|Villager/.test(who)?{pitch:.85,rate:.85}:/Mouse|Fairy/.test(who)?{pitch:1.2,rate:.95}:/Tortoise/.test(who)?{pitch:.95,rate:.75}:/Hare|Grasshopper/.test(who)?{pitch:1.1,rate:1}:{pitch:1,rate:.9};

// ---------- 화면 ----------
function home(){
  speechSynthesis?.cancel();
  app.innerHTML=`<p style="font-size:1.1rem">Hi, ${KID}! 👋 Pick a story!</p><div class="grid">${
    STORIES.map(s=>`<button class="book" data-id="${s.id}"><div class="cover">${s.cover}</div><b>${s.title}</b><small>${s.ko}</small>${finished[s.id]?'<div class="done">✅ Done!</div>':''}</button>`).join("")
  }</div>
  <div style="margin-top:28px;color:var(--soft);font-size:.95rem">🗣️ 읽어주는 목소리 (부모용)<br>
    <select id="voiceSel" style="font:inherit;padding:8px;border-radius:10px;margin-top:6px;max-width:100%"></select>
    <button class="btn" id="test" style="margin-left:6px;padding:8px 12px">▶ 들어보기</button></div>`;
  app.querySelectorAll(".book").forEach(b=>b.onclick=()=>read(b.dataset.id,0));
  renderVoicePicker();
  document.getElementById("voiceSel").onchange=e=>{voice=voices.find(v=>v.name===e.target.value)||voice;store.set("voice",voice?.name);speak(`Hi ${KID}! Let's read a story together.`)};
  document.getElementById("test").onclick=()=>speak(`Hi ${KID}! Once upon a time, a big lion was sleeping under a tree.`);
}

function read(id,i){
  const s=STORIES.find(x=>x.id===id);
  if(i>=s.scenes.length)return end(s);
  const sc=s.scenes[i];
  const words=sc.text.split(/\s+/);
  app.innerHTML=`
  <div class="top"><button class="btn" id="home">🏠</button><b style="flex:1">${s.title}</b>
    <button class="btn toggle" id="ko">${showKo?"🇰🇷 ON":"🇰🇷 OFF"}</button></div>
  <div class="scene">
    <div class="art pop ${sc.svg?"ill":""}">${sc.svg?svgArt(sc.svg):sc.art}</div>
    <div class="text">${words.map(w=>`<span data-w="${w.replace(/"/g,"&quot;")}">${w}</span>`).join(" ")}</div>
    <div class="ko">${showKo?sc.ko:""}</div>
    <div class="row">
      <button class="btn main" id="read">🔊 Read</button>
      <button class="btn" id="slow">🐢 Slow</button>
      ${sc.why?'<button class="btn teal" id="why">🎭 Why?</button>':''}
      ${sc.ask?'<button class="btn teal" id="ask">💬 Talk</button>':''}
      ${sc.quiz?'<button class="btn teal" id="quiz">❓ Quiz</button>':''}
    </div>
    <div class="panel" id="panel"></div>
  </div>
  <div class="nav">
    <button class="btn" id="prev" ${i===0?"disabled style=opacity:.4":""}>⬅️ Back</button>
    <span class="dots">${s.scenes.map((_,j)=>j===i?"●":"○").join(" ")}</span>
    <button class="btn main" id="next">Next ➡️</button>
  </div>`;
  const spans=[...app.querySelectorAll(".text span")];
  const panel=document.getElementById("panel");
  const $=id=>document.getElementById(id);
  $("home").onclick=home;
  $("ko").onclick=()=>{showKo=!showKo;store.set("showKo",showKo);read(id,i)};
  $("read").onclick=()=>speak(sc.text,{spans});
  $("slow").onclick=()=>speak(sc.text,{rate:.55,spans});
  spans.forEach(sp=>sp.onclick=()=>speak(sp.dataset.w.replace(/[^\w']/g,""),{rate:.7}));
  $("prev").onclick=()=>i>0&&read(id,i-1);
  $("next").onclick=()=>read(id,i+1);
  const open=html=>{panel.innerHTML=html;panel.classList.add("show");panel.classList.remove("pop");void panel.offsetWidth;panel.classList.add("pop")};
  if(sc.why)$("why").onclick=()=>{
    open(`<h3>${sc.why.who} says:</h3><p>"${sc.why.text}"</p>${showKo?`<p class="k">${sc.why.ko}</p>`:""}<div class="row"><button class="btn" id="again">🔊 Again</button></div>`);
    const go=()=>speak(sc.why.text,voiceFor(sc.why.who)); go(); $("again").onclick=go;
  };
  if(sc.ask)$("ask").onclick=()=>{
    open(`<h3>💬 Let's talk!</h3><p>${sc.ask.q}</p>${showKo?`<p class="k">${sc.ask.ko}</p>`:""}<div class="row"><button class="btn" id="again">🔊 Again</button><button class="btn main" id="said">🙋 I said it!</button></div>`);
    speak(sc.ask.q); $("again").onclick=()=>speak(sc.ask.q);
    $("said").onclick=()=>{addStar();speak(`Great job, ${KID}!`);$("said").disabled=true;$("said").textContent="⭐ +1"};
  };
  if(sc.quiz)$("quiz").onclick=()=>{
    open(`<h3>❓ ${sc.quiz.q}</h3><div class="opts">${sc.quiz.opts.map((o,k)=>`<button class="btn opt" data-k="${k}">${o[0]} ${o[1]}</button>`).join("")}</div>`);
    speak(sc.quiz.q); let got=false;
    panel.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
      const o=sc.quiz.opts[b.dataset.k];
      if(o[2]){b.classList.add("right");speak(`Yes! ${o[1]}! Good job!`);if(!got){got=true;addStar()}}
      else{b.classList.add("wrong");speak(`Hmm, not ${o[1]}. Try again!`)}
    });
  };
  window.scrollTo({top:0,behavior:"smooth"});
}

function end(s){
  if(!finished[s.id]){finished[s.id]=true;store.set("finished",finished);addStar(3)}
  app.innerHTML=`<div class="scene end">
    <div class="big pop">🎉</div><h2>The End!</h2>
    <p style="font-size:1.4rem">💡 ${s.moral}</p><p class="k" style="color:var(--soft)">${s.moralKo}</p>
    <p>Great reading, ${KID}! ⭐⭐⭐</p>
    <div class="row"><button class="btn main" id="moral">🔊 Say it!</button><button class="btn" id="again">🔁 Again</button><button class="btn" id="home">🏠 Home</button></div></div>`;
  speak(`The end! ${s.moral} Great reading, ${KID}!`);
  document.getElementById("moral").onclick=()=>speak(s.moral);
  document.getElementById("again").onclick=()=>read(s.id,0);
  document.getElementById("home").onclick=home;
}

home();
</script>
</body>
</html>
