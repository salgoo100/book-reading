<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="태리 영어책">
<meta name="theme-color" content="#ff8a3d">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<title>Tae-ri's Story Time</title>
<style>
:root{--bg:#fff8ec;--card:#fff;--ink:#3a2e2a;--soft:#8a7a70;--accent:#ff8a3d;--accent2:#4bb3a7;--hl:#ffe066;--line:#f0e2cf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Trebuchet MS","Apple SD Gothic Neo","Malgun Gothic",sans-serif;min-height:100vh}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:8px}
h1{font-size:1.5rem;margin:0}
.stars{font-size:1.1rem;background:#fff;border-radius:999px;padding:6px 14px;box-shadow:0 2px 0 var(--line)}
main{max-width:900px;margin:0 auto;padding:0 16px 40px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.book{background:var(--card);border-radius:20px;padding:18px;text-align:center;cursor:pointer;box-shadow:0 4px 0 var(--line);border:none;font:inherit;color:inherit;transition:transform .1s}
.book:active{transform:scale(.97)}
.book .cover{font-size:3.4rem}
.book b{display:block;font-size:1.15rem;margin-top:6px}
.book small{color:var(--soft)}
.done{color:var(--accent2);font-weight:bold}
.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.btn{border:none;border-radius:16px;padding:12px 16px;font:inherit;font-size:1.05rem;cursor:pointer;background:#fff;color:var(--ink);box-shadow:0 3px 0 var(--line)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.btn.main{background:var(--accent);color:#fff;box-shadow:0 3px 0 #d96a22}
.btn.teal{background:var(--accent2);color:#fff;box-shadow:0 3px 0 #2f8a80}
.scene{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 4px 0 var(--line)}
.art{font-size:clamp(3.5rem,14vw,6.5rem);text-align:center;line-height:1.2;min-height:1.3em;letter-spacing:.05em}
.text{font-size:clamp(1.3rem,4.5vw,1.9rem);line-height:1.6;text-align:center;margin:14px 0 4px}
.text span{border-radius:6px;padding:0 2px;cursor:pointer}
.text span.on{background:var(--hl)}
.ko{text-align:center;color:var(--soft);font-size:1rem;min-height:1.2em}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.panel{margin-top:16px;background:#fff4e0;border-radius:18px;padding:16px;display:none}
.panel.show{display:block}
.panel h3{margin:0 0 6px}
.panel p{margin:6px 0;font-size:1.15rem;line-height:1.5}
.panel .k{color:var(--soft);font-size:.95rem}
.opts{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.opt{font-size:1.1rem}
.opt.right{background:#c9f2d0}.opt.wrong{background:#ffd6d6}
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.dots{color:var(--soft)}
.end{text-align:center}
.end .big{font-size:5rem}
.toggle{font-size:.95rem}
.art.ill{font-size:0;line-height:0;margin:-8px -8px 0;position:relative}
.art.ill img{width:100%;max-height:58vh;object-fit:cover;border-radius:18px;display:block;background:#f3e6cf;box-shadow:0 6px 18px rgba(90,60,30,.18)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
/* 🎬 영상 모드 */
#vwrap{position:fixed;inset:0;background:#000;z-index:50;display:flex;align-items:center;justify-content:center;cursor:pointer}
#vwrap.playing{cursor:none}
#vstage{position:relative;width:min(100vw,177.78vh);aspect-ratio:16/9;overflow:hidden;background:#111;container-type:inline-size}
.vbg{position:absolute;inset:-30px;background-size:cover;background-position:center;filter:blur(20px) brightness(.6)}
.vimg{position:absolute;left:50%;top:0;height:100%;aspect-ratio:4/3;transform:translateX(-50%);object-fit:cover;transition:opacity .3s}
.vsub{position:absolute;left:0;right:0;bottom:0;padding:5cqw 7cqw 2.6cqw;text-align:center;color:#fff;
  background:linear-gradient(transparent,rgba(0,0,0,.78) 35%);text-shadow:0 2px 6px rgba(0,0,0,.6)}
.ven{font-size:3.3cqw;line-height:1.45;font-weight:bold}
.ven span{border-radius:.2em;padding:0 .08em;transition:color .1s}
.ven span.on{color:#ffe066}
.vko{font-size:2cqw;opacity:.9;margin-top:.5cqw}
.vcard{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;
  padding:6cqw;background:rgba(0,0,0,.45);color:#fff;text-shadow:0 3px 10px rgba(0,0,0,.7)}
.vcard.show{display:flex}
.vcard h1{font-size:6.5cqw;margin:0 0 1cqw}
.vcard p{font-size:3.4cqw;margin:.6cqw 0}
.vcard .vq{font-size:4.2cqw;font-weight:bold;background:rgba(255,248,236,.95);color:#3a2e2a;text-shadow:none;padding:2.5cqw 4cqw;border-radius:3cqw}
.vcard .vqk{font-size:2.4cqw;opacity:.95}
.vhint{position:absolute;bottom:18px;left:0;right:0;text-align:center;color:#fff;opacity:.85;font-size:14px}
</style>
</head>
<body>
<header>
  <h1>📚 Tae-ri's Story Time</h1>
  <div class="stars" id="stars">⭐ 0</div>
</header>
<main id="app"></main>

<script>

const STORIES = [
{
  id:"lion", title:"The Lion and the Mouse", ko:"사자와 쥐", cover:"🦁🐭",
  levels:{
  2:[
    {pic:"scene1", art:"🦁💤", who:"lion", text:"One hot afternoon, a big lion was sleeping under a tree. \"Zzz...\"", ko:"어느 더운 오후, 커다란 사자가 나무 아래에서 자고 있었어요. \"쿨쿨...\"",

    {pic:"scene2", art:"🐭🏃‍♂️🦁", text:"A tiny mouse was looking for food. Oops! She ran right over the lion's nose.", ko:"작은 쥐가 먹이를 찾고 있었어요. 앗! 사자 코 위로 달려가 버렸어요.",
     why:{who:"🐭 Mouse", text:"I was so hungry, I didn't look where I was going!", ko:"너무 배고파서 앞을 안 봤어요!"}},
    {pic:"scene3", art:"🦁🐾🐭", who:"lion", text:"The lion woke up and caught her tail. \"ROAR! I will eat you!\"", ko:"사자가 깨어나 쥐의 꼬리를 잡았어요. \"어흥! 잡아먹겠다!\"",

    {pic:"lion-laughs", art:"🦁😂🐭", who:"mouse,lion", text:"\"Please let me go! Someday I will help you.\" The lion laughed. \"You? Help ME?\" But he let her go.", ko:"\"놓아주세요! 언젠가 도와드릴게요.\" 사자가 웃었어요. \"네가? 나를 돕는다고?\" 그래도 놓아줬어요.",

    {pic:"hunters-net", art:"🕸️🌾", text:"A few days later, hunters hid a big net in the grass.", ko:"며칠 뒤, 사냥꾼들이 풀숲에 큰 그물을 숨겼어요.",
     ask:{q:`${KID}, what do you think will happen?`, ko:"어떤 일이 일어날 것 같아?"}},
    {pic:"scene4", art:"🦁🕸️😢", who:"lion", text:"The lion walked into the net. \"Help! Help!\" he roared.", ko:"사자가 그물에 걸렸어요. \"도와줘! 도와줘!\" 사자가 울부짖었어요.",

    {pic:"scene5", art:"🐭🦷🕸️", text:"The mouse heard him and ran fast. Chomp, chomp! She chewed the ropes.", ko:"쥐가 소리를 듣고 빨리 달려왔어요. 냠냠! 밧줄을 갉았어요.",
     why:{who:"🐭 Mouse", text:"He let me go before. Now it's my turn to help!", ko:"전에 저를 놓아줬잖아요. 이번엔 제가 도울 차례예요!"}},
    {pic:"scene6", art:"🦁❤️🐭", who:"lion", text:"The lion was free! \"Thank you, little friend!\" From that day on, they were best friends.", ko:"사자가 풀려났어요! \"고마워, 작은 친구!\" 그날부터 둘은 단짝이 되었어요.",

  3:[
    {pic:"scene1", art:"🦁💤", text:"On a hot afternoon, a mighty lion was taking a long nap in the shade of a tree.", ko:"어느 더운 오후, 힘센 사자가 나무 그늘에서 긴 낮잠을 자고 있었어요.",
     ask:{q:"Mighty means very strong. Show me a mighty lion pose!", ko:"mighty는 '아주 힘센'이라는 뜻이야. 힘센 사자 자세를 보여줘!"}},
    {pic:"scene2", art:"🐭🏃‍♂️🦁", text:"Nearby, a tiny mouse was hunting for seeds. She was in such a hurry that she scampered right across the lion's nose!", ko:"근처에서 작은 쥐가 씨앗을 찾고 있었어요. 너무 서두르다가 사자 코 위를 쪼르르 지나갔어요!",
     why:{who:"🐭 Mouse", text:"I was in a hurry to find food for my babies!", ko:"아기들 먹을 걸 찾느라 바빴어요!"}},
    {pic:"scene3", art:"🦁🐾🐭", who:"lion", text:"The lion's eyes flew open. He trapped her tail under his giant paw. \"How dare you wake me? I'll eat you for lunch!\"", ko:"사자의 눈이 번쩍 떠졌어요. 커다란 앞발로 꼬리를 눌렀어요. \"감히 나를 깨워? 점심으로 먹어 주마!\"",
     quiz:{q:"How does the lion feel?", opts:[["😠","angry",1],["😊","happy",0],["😢","sad",0]]}},
    {pic:"lion-laughs", art:"🦁😂🐭", who:"mouse,mouse", text:"\"Please let me go,\" squeaked the mouse. \"I promise I will help you someday.\" The lion laughed so hard that he let her go.", ko:"\"놓아주세요.\" 쥐가 찍찍 말했어요. \"언젠가 꼭 도와드릴게요.\" 사자는 너무 웃겨서 쥐를 놓아줬어요.",
     why:{who:"🦁 Lion", text:"A tiny mouse help a king like me? That was the funniest thing I ever heard!", ko:"작은 쥐가 왕인 나를 돕는다고? 그렇게 웃긴 말은 처음이었지!"}},
    {pic:"hunters-net", art:"🕸️🌾", text:"A few days later, hunters came. They hid a strong rope net in the tall grass.", ko:"며칠 뒤, 사냥꾼들이 왔어요. 키 큰 풀숲에 튼튼한 밧줄 그물을 숨겼어요.",

    {pic:"mouse-runs", art:"🐭💨🌾", who:"mouse", text:"Far away, the mouse heard his roar. \"That's my friend!\" She raced through the grass as fast as her little legs could go.", ko:"멀리서 쥐가 포효를 들었어요. \"내 친구야!\" 작은 다리로 있는 힘껏 풀숲을 달렸어요.",

    {pic:"scene5", art:"🐭🦷🕸️", text:"She began to gnaw the thick ropes. Chomp, chomp, chomp! One by one, the ropes snapped.", ko:"굵은 밧줄을 갉기 시작했어요. 냠냠냠! 하나씩 하나씩 밧줄이 끊어졌어요.",

     why:{who:"🦁 Lion", text:"I was wrong. Size doesn't matter. A kind heart does.", ko:"내가 틀렸어. 크기는 중요하지 않아. 착한 마음이 중요하지."}},

    {art:"🦁🕸️😢", who:"lion", text:"One day, the lion is caught in a net. \"Help! Help!\"", ko:"어느 날 사자가 그물에 걸렸어요. \"도와줘!\"",

{

  3:[

  3:[

    {pic:"scene2", art:"👦📢😆", who:"boy,boy", text:"\"I know how to have some fun,\" he thought. He took a deep breath and shouted, \"Wolf! Wolf! A wolf is chasing the sheep!\"", ko:"\"재밌는 방법이 있지.\" 소년은 생각했어요. 숨을 크게 쉬고 외쳤어요. \"늑대다! 늑대! 늑대가 양을 쫓고 있어요!\"",

    {pic:"again", art:"👦📢👨‍🌾😮‍💨", text:"But a few days later, the boy did it again. Once more, the villagers came running, red-faced and out of breath. And once more, there was no wolf.", ko:"그런데 며칠 뒤, 소년은 또 그랬어요. 마을 사람들은 또 얼굴이 빨개지고 숨이 차도록 달려왔어요. 이번에도 늑대는 없었어요.",

     ask:{q:"Crept means walked very quietly. Let's creep like a wolf!", ko:"crept는 살금살금 걸었다는 뜻이야. 늑대처럼 살금살금 걸어 볼까?"}},
    {pic:"scene5", art:"🏠👨‍🌾🙉", who:"villager", text:"Down in the village, people heard him, but they kept working. \"He's just playing tricks again,\" they grumbled.", ko:"아래 마을 사람들은 소리를 들었지만 계속 일했어요. \"또 장난치는 거겠지.\" 사람들이 투덜댔어요.",

    {pic:"alone", art:"👦😭🌅", text:"Nobody came. The frightened sheep ran off across the hills, and the boy sat alone, crying.", ko:"아무도 오지 않았어요. 겁먹은 양들은 언덕 너머로 흩어졌고, 소년은 혼자 앉아 울었어요.",

  3:[
    {pic:"scene1", art:"👧🧹", text:"Long ago, there lived a kind girl named Cinderella. Every day she swept, cooked, and washed, but she always stayed gentle.", ko:"옛날 옛날에 신데렐라라는 착한 소녀가 살았어요. 매일 쓸고, 요리하고, 빨래했지만 언제나 상냥했어요.",
     why:{who:"👧 Cinderella", text:"My stepsisters are not kind to me. But being kind makes my heart feel warm.", ko:"언니들은 나에게 친절하지 않아요. 하지만 친절하면 내 마음이 따뜻해져요."}},
    {pic:"scene2", art:"✉️👑💃", who:"cinderella,stepsister", text:"One morning, an invitation arrived from the palace. \"May I go too?\" Cinderella asked. Her stepsisters laughed. \"You? In those rags?\"", ko:"어느 날 아침, 궁전에서 초대장이 왔어요. \"저도 가도 돼요?\" 신데렐라가 물었어요. 언니들이 웃었어요. \"너? 그 누더기를 입고?\"",

     why:{who:"👧 Cinderella", text:"I wanted to go too. But I still helped them, because that is what a kind person does.", ko:"나도 가고 싶었어요. 그래도 도와줬어요. 착한 사람은 그렇게 하니까요."},

     why:{who:"👧 Cinderella", text:"I stayed kind, even on hard days. And kindness found its way back to me.", ko:"힘든 날에도 친절했더니, 그 친절이 나에게 돌아왔어요."},

  moral:"Be kind, and good things come!", moralKo:"착한 마음은 좋은 일을 불러와요!",
  scenes:[

    {art:"✉️👑💃", text:"The prince has a party! But Cinderella can't go.", ko:"왕자님 무도회! 하지만 신데렐라는 못 가요.",

    {art:"🧚‍♀️✨🎃", who:"fairy", text:"Poof! A fairy godmother comes. \"You shall go to the party!\"", ko:"뿅! 요정 대모가 나타나요. \"무도회에 가게 해줄게!\"",

};

// ---------- 음성 ----------
let voice=null, voices=[];
// 자연스러운(뉴럴) 음성일수록 높은 점수
function score(v){
  let s=0;const n=v.name;
  if(/Natural|Neural|Premium|Enhanced|Online/i.test(n))s+=100;
  if(/Ava|Aria|Jenny|Emma|Michelle|Ana|Samantha|Allison|Google US English/i.test(n))s+=30;
  if(v.lang==="en-US"||v.lang==="en_US")s+=20;else if(/^en-(GB|AU|CA)/i.test(v.lang))s+=10;
  if(/David|Zira|Mark|Fred|Albert|Bad News|Bells|Boing|Bubbles|Cellos|Jester|Organ|Trinoids|Whisper|Zarvox|Superstar|Wobble|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley/i.test(n))s-=50;
  return s;
}
function pickVoice(){
  voices=speechSynthesis.getVoices().filter(v=>/^en[-_]/i.test(v.lang)).sort((a,b)=>score(b)-score(a));
  const saved=store.get("voice",null);
  voice=voices.find(v=>v.name===saved)||voices[0]||null;
  renderVoicePicker();
}
function renderVoicePicker(){
  const sel=document.getElementById("voiceSel");
  if(!sel)return;
  sel.innerHTML=voices.map(v=>`<option ${v===voice?"selected":""}>${v.name}</option>`).join("");
}
if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
// 전체 읽기(자동 넘김) 상태. playId가 바뀌면 이전 재생의 콜백은 무시
let auto=false, playId=0;
function stopAuto(){auto=false;playId++}
// 배역: g = 목소리 종류(n 나레이터, m 남자, f 여자, c 아이), 음높이·속도로 성격 표현
const CAST={
  narrator:{g:"n",pitch:1,rate:.78},
  mother:{g:"f",pitch:1.05,rate:.8},
  papa:{g:"m",pitch:.8,rate:.8}, mama:{g:"f",pitch:1.05,rate:.82}, baby:{g:"c",pitch:1.4,rate:.9}, goldilocks:{g:"c",pitch:1.2,rate:.88},
  grandma:{g:"f",pitch:.95,rate:.8}, grandpa:{g:"m",pitch:.9,rate:.8}, cow:{g:"m",pitch:.7,rate:.7}, horse:{g:"m",pitch:1,rate:.9},
  fox:{g:"m",pitch:.95,rate:.85}, gingerbread:{g:"c",pitch:1.35,rate:.95},
  woodcutter:{g:"m",pitch:1,rate:.82}, spirit:{g:"m",pitch:.75,rate:.75}, neighbor:{g:"m",pitch:1.05,rate:.9},
  heungbu:{g:"m",pitch:1,rate:.82}, nolbu:{g:"m",pitch:.8,rate:.85}, swallow:{g:"c",pitch:1.5,rate:.95},
  lion:{g:"m",pitch:.75,rate:.75}, wolf:{g:"m",pitch:.7,rate:.8}, villager:{g:"m",pitch:.9,rate:.82},
  tortoise:{g:"m",pitch:.85,rate:.6}, hare:{g:"m",pitch:1.2,rate:.98}, grasshopper:{g:"m",pitch:1.15,rate:.9},
  prince:{g:"m",pitch:1,rate:.8},
  mouse:{g:"c",pitch:1.45,rate:.92}, boy:{g:"c",pitch:1.15,rate:.88}, pig:{g:"c",pitch:1.35,rate:.9},
  ant:{g:"f",pitch:1.25,rate:.88}, fairy:{g:"f",pitch:1.3,rate:.82}, cinderella:{g:"f",pitch:1.1,rate:.8},
  stepsister:{g:"f",pitch:1.2,rate:.9}
};
const MALE=/Guy|Davis|Christopher|Eric|Roger|Steffan|Andrew|Brian|Ryan|Tony|Jason|Daniel|Alex|Aaron|Thomas|Oliver|George|David|Mark|Male|Tom|Evan|Nathan|Arthur/i;
const CHILD=/\bAna\b/i;
const castVoice={};
function castVoices(){
  const fem=voices.filter(v=>!MALE.test(v.name)&&!CHILD.test(v.name));
  const male=voices.filter(v=>MALE.test(v.name));
  const kid=voices.filter(v=>CHILD.test(v.name));
  castVoice.n=voice;
  castVoice.m=male[0]||voice;
  castVoice.f=fem.find(v=>v!==voice)||voice;
  castVoice.c=kid[0]||castVoice.f;
}
const roleOf=who=>{const w=who.toLowerCase();return Object.keys(CAST).find(k=>w.includes(k))||"narrator"};

// parts([{text, role, offset}])를 차례로 읽는다. offset은 단어 하이라이트용 원문 내 위치
function speakParts(parts,{spans=null,done=null,slow=false,full=""}={}){
  if(!("speechSynthesis" in window))return;
  stopAll(); castVoices();
  let starts=null;
  if(spans){starts=[];let pos=0;
    spans.forEach(sp=>{const i=full.indexOf(sp.dataset.w,pos);starts.push(i);pos=i+sp.dataset.w.length})}
  parts.forEach((p,k)=>{
    const c=p.voice||CAST[p.role]||CAST.narrator;
    const u=new SpeechSynthesisUtterance(p.text.replaceAll(KID,KID_SAY));
    const v=castVoice[c.g]||voice; if(v)u.voice=v;
    u.lang="en-US"; u.pitch=c.pitch; u.rate=c.rate*(slow?.72:1);
    if(spans)u.onboundary=e=>{const at=p.offset+e.charIndex;spans.forEach((sp,i)=>sp.classList.toggle("on",at>=starts[i]&&at<starts[i]+sp.dataset.w.length))};
    if(k===parts.length-1)u.onend=()=>{spans&&spans.forEach(sp=>sp.classList.remove("on"));done&&done()};
    speechSynthesis.speak(u);
  });
}
// 장면 문장을 나레이션과 "대사"로 쪼개고, 대사에는 who 순서대로 배역을 붙인다
function sceneParts(sc){
  const who=(sc.who||"").split(",").filter(Boolean);let q=0;const out=[];
  for(const m of sc.text.matchAll(/"[^"]*"|[^"]+/g)){
    if(!m[0].trim())continue;
    out.push({text:m[0],offset:m.index,role:m[0].startsWith('"')?(who[q++]||"narrator"):"narrator"});
  }
  return out;
}
const readScene=(sc,opt={})=>{
  const parts=sceneParts(sc), keys=parts.map((_,j)=>`${opt.key}-p${j+1}`);
  if(opt.key&&hasAudio(keys))return playClips(parts.map((p,j)=>({key:keys[j],offset:p.offset,len:p.text.length})),{...opt,full:sc.text});
  speakParts(parts,{...opt,full:sc.text});
};
const speak=(text,{rate=0.78,pitch=1,done=null,key=null}={})=>key&&AUDIO[key]?playClips([{key,offset:0,len:0}],{done}):speakParts([{text,offset:0,voice:{g:"n",pitch,rate}}],{done});
const speakAs=(text,role,key)=>key&&AUDIO[key]?playClips([{key,offset:0,len:0}]):speakParts([{text,offset:0,role}]);

// ---------- 미리 만든 OpenAI TTS 음성 (audio/manifest.json) ----------
// 파일이 있으면 MP3를 틀고, 없으면 위의 브라우저 음성으로 대신 읽는다
let AUDIO={};
fetch("audio/manifest.json").then(r=>r.ok?r.json():{}).then(m=>{AUDIO=m;if(vSetupOpen&&!document.getElementById("vwrap"))videoSetup()}).catch(()=>{});
const player=new Audio(); let clipId=0;
// 미리 만든 음성의 재생 속도 (음높이는 유지). 기본은 조금 빠르게, Slow 버튼은 천천히
const AUDIO_RATE={normal:1.2,slow:.85};
function stopAll(){clipId++;player.pause();player.onended=null;if("speechSynthesis" in window)speechSynthesis.cancel()}
const hasAudio=keys=>keys.length&&keys.every(k=>AUDIO[k]);
// clips: [{key, offset, len}] 를 이어서 재생. offset/len은 단어 하이라이트용
// 음성 파일엔 단어 타이밍이 없어서, 단어 길이·문장부호로 각 단어 시점을 추정해 한 단어씩 표시한다.
// manifest의 s/e(앞뒤 무음을 뺀 실제 말소리 구간, 초)가 있으면 그 구간에 맞춘다
const wordWeight=w=>2+w.replace(/[^A-Za-z]/g,"").length+(/[.!?]["”]?$/.test(w)?5:/[,;:]["”]?$/.test(w)?3:0);
function playClips(clips,{spans=null,done=null,slow=false,full=""}={}){
  stopAll(); const my=clipId;
  const starts=[];if(spans){let pos=0;spans.forEach(sp=>{const i=full.indexOf(sp.dataset.w,pos);starts.push(i);pos=i+sp.dataset.w.length})}
  const clear=()=>spans&&spans.forEach(sp=>sp.classList.remove("on"));
  let k=0;
  const next=()=>{
    if(my!==clipId)return;
    if(k>=clips.length){clear();done&&done();return}
    const c=clips[k++], meta=AUDIO[c.key], me=k;
    const idx=spans?spans.map((_,i)=>i).filter(i=>starts[i]>=c.offset&&starts[i]<c.offset+c.len):[];
    let acc=0; const cum=idx.map(i=>acc+=wordWeight(spans[i].dataset.w));
    const tick=()=>{
      if(my!==clipId||me!==k||player.ended)return;  // 다른 클립으로 넘어갔으면 이 루프는 끝
      const s0=meta.s||0, e0=meta.e||player.duration||1, t=player.currentTime;
      const f=Math.max(0,Math.min(.999,(t-s0)/(e0-s0)))*acc;
      const j=cum.findIndex(x=>x>f);
      clear(); if(t>=s0)spans[idx[j<0?idx.length-1:j]].classList.add("on");
      setTimeout(tick,50);
    };
    player.src="audio/"+meta.f; player.defaultPlaybackRate=player.playbackRate=slow?AUDIO_RATE.slow:AUDIO_RATE.normal; player.preservesPitch=true;
    player.onended=()=>{clear();setTimeout(next,250)};
    player.play().then(()=>{if(idx.length)tick()}).catch(clear);
  };
  next();
}

  }</div>

function read(id,i,lv=1){

  if(auto){
    const my=++playId;
    setTimeout(()=>{ if(my!==playId)return;
      readScene(sc,{key:K,spans,done:()=>{ if(my===playId) setTimeout(()=>{ if(my===playId) read(id,i+1,lv) },1800) }});
    },700);

  $("read").onclick=()=>{stopAuto();readScene(sc,{key:K,spans})};
  $("slow").onclick=()=>{stopAuto();readScene(sc,{key:K,spans,slow:true})};
  spans.forEach(sp=>sp.onclick=()=>speak(sp.dataset.w.replace(/[^\w']/g,""),{rate:.7}));
  $("prev").onclick=()=>{if(i>0){stopAuto();stopAll();read(id,i-1,lv)}};
  $("next").onclick=()=>{stopAuto();stopAll();read(id,i+1,lv)};
  const open=html=>{panel.innerHTML=html;panel.classList.add("show");panel.classList.remove("pop");void panel.offsetWidth;panel.classList.add("pop")};
  if(sc.why)$("why").onclick=()=>{pause();

    });

}

  if(!finished[dk]){finished[dk]=true;store.set("finished",finished);addStar(3)}
  app.innerHTML=`<div class="scene end">
    <div class="big pop">🎉</div><h2>The End!</h2>
    <p style="font-size:1.4rem">💡 ${s.moral}</p><p class="k" style="color:var(--soft)">${s.moralKo}</p>
    <p>Great reading, ${KID}! ⭐⭐⭐</p>
    <div class="row"><button class="btn main" id="moral">🔊 Say it!</button>${up?`<button class="btn main" id="up">${LV[up][0]} Try ${LV[up][1]}!</button>`:""}<button class="btn" id="again">🔁 Again</button><button class="btn" id="home">🏠 Home</button></div></div>`;
  stopAuto(); speak(`The end! ${s.moral} Great reading, ${KID}!`,{key:`${s.id}/end`});
  document.getElementById("moral").onclick=()=>speak(s.moral,{key:`${s.id}/moral`});
  document.getElementById("again").onclick=()=>read(s.id,0,lv);
  if(up)document.getElementById("up").onclick=()=>read(s.id,0,up);
  document.getElementById("home").onclick=home;
}

// ---------- 🎬 영상 모드 (유튜브 녹화용) ----------
// 버튼 없는 16:9 화면에 그림 + 자막, 장면 자동 넘김. 아이 이름은 VIDEO_NAME으로 바꾸고,
// 이름이 들어간 음성 클립은 틀지 않는다. Gemini 음성이 모두 있는 단계만 고를 수 있다
const VIDEO_NAME="friend";
const vText=t=>t.replaceAll(KID,VIDEO_NAME);
const sceneKey=(s,lv,i)=>lv===1?`${s.id}/s${i+1}`:`${s.id}/L${lv}/s${i+1}`;
const videoReady=(s,lv)=>!!AUDIO[`${s.id}/moral`]&&scenesOf(s,lv).every((sc,i)=>sceneParts(sc).every((_,j)=>AUDIO[`${sceneKey(s,lv,i)}-p${j+1}`]));
let vOpt=store.get("vopt",{ko:false,talk:true}), vRun=0, vSetupOpen=false;
const wait=ms=>new Promise(r=>setTimeout(r,ms));

function videoSetup(){
  stopAuto(); stopAll(); vSetupOpen=true; history.replaceState(null,"","#video");
  const rows=STORIES.flatMap(s=>[1,...Object.keys(s.levels||{}).map(Number)].map(lv=>({s,lv,ok:videoReady(s,lv)})));
  app.innerHTML=`<div class="top"><button class="btn" id="home">🏠</button><b style="flex:1">🎬 Video mode</b></div>
  <p style="color:var(--soft);line-height:1.5">녹화용 화면이에요. 버튼 없이 그림과 자막만 나오고 장면이 자동으로 넘어가요.
  아이 이름은 "${VIDEO_NAME}"로 바뀌어요. Gemini 음성이 모두 있는 단계만 고를 수 있어요.<br>
  시작 화면에서 클릭하거나 스페이스를 누르면 전체 화면으로 재생돼요. Esc를 누르면 나가요.</p>
  <div class="row" style="justify-content:flex-start">
    <label class="btn"><input type="checkbox" id="vko" ${vOpt.ko?"checked":""}> 한국어 자막</label>
    <label class="btn"><input type="checkbox" id="vtalk" ${vOpt.talk?"checked":""}> 💬 Talk 질문 (생각할 시간)</label>
  </div>
  <div class="grid" style="margin-top:14px">${rows.map(r=>`<button class="book" data-id="${r.s.id}" data-lv="${r.lv}" ${r.ok?"":"disabled style=\"opacity:.4;cursor:default\""}>
    <b>${r.s.title}</b><small>${r.s.levels?`${LV[r.lv][0]} ${LV[r.lv][1]}`:""}${r.ok?"":" · 음성 준비 중"}</small></button>`).join("")}</div>`;
  document.getElementById("home").onclick=()=>{vSetupOpen=false;history.replaceState(null,"",location.pathname);home()};
  const save=()=>{vOpt={ko:document.getElementById("vko").checked,talk:document.getElementById("vtalk").checked};store.set("vopt",vOpt)};
  document.getElementById("vko").onchange=save; document.getElementById("vtalk").onchange=save;
  app.querySelectorAll(".book:not([disabled])").forEach(b=>b.onclick=()=>videoPlay(b.dataset.id,+b.dataset.lv));
}

function videoPlay(id,lv){
  const s=STORIES.find(x=>x.id===id), scs=scenesOf(s,lv), my=++vRun;
  const wrap=document.createElement("div"); wrap.id="vwrap";
  wrap.innerHTML=`<div id="vstage"><div class="vbg"></div><img class="vimg" alt="">
    <div class="vsub"><div class="ven"></div><div class="vko"></div></div><div class="vcard"></div></div>
    <div class="vhint">Click or press Space to start · Esc to exit</div>`;
  document.body.appendChild(wrap);
  const $=q=>wrap.querySelector(q), bg=$(".vbg"), img=$(".vimg"), sub=$(".vsub"), en=$(".ven"), ko=$(".vko"), card=$(".vcard");
  const pic=(src)=>{img.style.opacity=0;setTimeout(()=>{img.src=src;bg.style.backgroundImage=`url(${src})`;img.style.opacity=1},300)};
  const showCard=html=>{card.innerHTML=html;card.classList.add("show")};
  const hideCard=()=>card.classList.remove("show");
  const exit=()=>{vRun++;stopAll();document.removeEventListener("keydown",key);wrap.remove();if(document.fullscreenElement)document.exitFullscreen().catch(()=>{})};
  const key=e=>{if(e.key==="Escape")exit();else if(e.key===" "&&!started){e.preventDefault();start()}};
  document.addEventListener("keydown",key);
  let started=false;
  pic(`images/${s.id}/scene1.webp`);
  showCard(`<h1>${s.title}</h1>${s.levels?`<p>${LV[lv][0]} ${LV[lv][1]}</p>`:""}`);
  sub.style.visibility="hidden";
  wrap.onclick=()=>{if(!started)start()};
  async function start(){
    started=true; $(".vhint").remove(); wrap.classList.add("playing");
    if(wrap.requestFullscreen)await wrap.requestFullscreen().catch(()=>{});
    await wait(2500); if(my!==vRun)return;
    hideCard(); sub.style.visibility="visible";
    for(let i=0;i<scs.length;i++){
      const sc=scs[i], K=sceneKey(s,lv,i), parts=sceneParts(sc);
      pic(`images/${s.id}/${picOf(sc,i)}.webp`);
      en.innerHTML=sc.text.split(/\s+/).map(w=>`<span data-w="${w.replace(/"/g,"&quot;")}">${w}</span>`).join(" ");
      ko.textContent=vOpt.ko?sc.ko:"";
      await wait(600); if(my!==vRun)return;
      await new Promise(res=>playClips(parts.map((p,j)=>({key:`${K}-p${j+1}`,offset:p.offset,len:p.text.length})),{spans:[...en.querySelectorAll("span")],full:sc.text,done:res}));
      if(my!==vRun)return;
      await wait(1200); if(my!==vRun)return;
      // 💬 Talk 질문: 화면에 띄우고 생각할 시간을 준다. 이름이 들어간 질문은 음성 없이 자막만
      if(vOpt.talk&&sc.ask){
        showCard(`<p class="vq">💬 ${vText(sc.ask.q)}</p>${vOpt.ko?`<p class="vqk">${vText(sc.ask.ko).replaceAll("태리","친구")}</p>`:""}`);
        if(!sc.ask.q.includes(KID)&&AUDIO[`${K}-ask`])await new Promise(res=>playClips([{key:`${K}-ask`,offset:0,len:0}],{done:res}));
        await wait(4000); if(my!==vRun)return;
        hideCard();
      }
    }
    sub.style.visibility="hidden";
    showCard(`<h1>The End</h1><p>💡 ${s.moral}</p>${vOpt.ko?`<p class="vqk">${s.moralKo}</p>`:""}`);
    await wait(800); if(my!==vRun)return;
    playClips([{key:`${s.id}/moral`,offset:0,len:0}]);
  }
}

location.hash==="#video"?videoSetup():home();
</script>
</body>
